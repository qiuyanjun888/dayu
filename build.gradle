plugins {
    id 'java'
    id 'application'
    id 'io.freefair.lombok' version '6.6.3'
    id 'idea'
}
repositories {
    mavenCentral()
    maven {url "https://repo.spring.io/plugins-release/"}
    maven {url "https://maven.aliyun.com/repository/spring-plugin"}
    mavenLocal()
}

group = 'com.dayu'
version = '1.0.0'
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

idea {
    module {
        downloadSources = true
        downloadJavadoc = false
    }
}

ext {
    hadoopVersion = '2.6.0'
    hiveVersion = '1.2.1'
    sparkVersion = '2.4.0'
    slf4jVersion = '2.0.17'
    logbackVersion = '1.3.15'
    jacksonVersion = '2.13.3'
    snakeyamlVersion = '1.33'
    commonsCliVersion = '1.5.0'
    poiVersion = '5.2.5'
    junitVersion = '4.13.2'
    derbyVersion = '10.14.2.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // 日志依赖 - 这些会被打包
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Hadoop 依赖 - 只在编译时需要，不打包
    implementation "org.apache.hadoop:hadoop-client:${hadoopVersion}"
    implementation "org.apache.hadoop:hadoop-common:${hadoopVersion}"
    implementation "org.apache.hadoop:hadoop-hdfs:${hadoopVersion}"

    // Hive 依赖 - 只在编译时需要，不打包
    implementation "org.apache.hive:hive-exec:${hiveVersion}"
    implementation "org.apache.hive:hive-metastore:${hiveVersion}"

    // Spark 依赖 - 只在编译时需要，不打包
    implementation "org.apache.spark:spark-core_2.12:${sparkVersion}"
    implementation "org.apache.spark:spark-sql_2.12:${sparkVersion}"
    implementation "org.apache.spark:spark-hive_2.12:${sparkVersion}"
    implementation "org.apache.spark:spark-launcher_2.12:${sparkVersion}"


    // Jackson 依赖 - 这些会被打包
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
    
    // YAML 解析 - 这些会被打包
    implementation "org.yaml:snakeyaml:${snakeyamlVersion}"

    // 命令行参数解析 - 这些会被打包
    implementation "commons-cli:commons-cli:${commonsCliVersion}"

    // Excel 报表生成 - 这些会被打包
    implementation "org.apache.poi:poi:${poiVersion}"
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"
    implementation "org.apache.poi:poi-ooxml-full:${poiVersion}"
    implementation "org.apache.xmlbeans:xmlbeans:5.1.1"

    // ============= 测试相关依赖 =============
    // 基础测试框架
    testImplementation "junit:junit:${junitVersion}"

    // 测试时需要这些实现依赖
    testImplementation "org.apache.hadoop:hadoop-common:${hadoopVersion}"
    testImplementation "org.apache.hadoop:hadoop-hdfs:${hadoopVersion}"
    testImplementation "org.apache.hive:hive-metastore:${hiveVersion}"
    testImplementation"org.apache.hive:hive-exec:${hiveVersion}"

    // Hive 测试依赖
    testImplementation "org.apache.derby:derby:${derbyVersion}"
    testImplementation "org.apache.hive:hive-jdbc:${hiveVersion}"

    // Spark 测试依赖
    testImplementation "org.apache.spark:spark-sql_2.12:${sparkVersion}"
    testImplementation "org.apache.spark:spark-hive_2.12:${sparkVersion}"
}

application {
    mainClass = 'com.dayu.smallfile.SmallFileMergeApp'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.dayu.smallfile.SmallFileMergeApp'
        )
    }
}

// 创建包含所有依赖的 fat jar，但排除Hadoop/Spark/Hive依赖
tasks.register('fatJar', Jar) {
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    from sourceSets.main.output
    
    // 创建一个包含所有运行时依赖但排除Hadoop/Spark/Hive依赖的配置
    def runtimeWithoutHadoopSparkHive = configurations.runtimeClasspath.copyRecursive { dependency ->
        def groupId = dependency.group
        !(groupId.startsWith('org.apache.hadoop') || 
          groupId.startsWith('org.apache.spark') || 
          groupId.startsWith('org.apache.hive'))
    }
    
    from {
        runtimeWithoutHadoopSparkHive.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    manifest {
        attributes(
                'Main-Class': 'com.dayu.smallfile.SmallFileMergeApp'
        )
    }
}

// 默认编码设置为UTF-8
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// 解决测试依赖冲突
configurations.all {
    resolutionStrategy {
        force 'org.apache.logging.log4j:log4j-api:2.17.2'
        force 'org.apache.logging.log4j:log4j-core:2.17.2'
        force "org.apache.thrift:libfb303:0.9.2"
    }
}